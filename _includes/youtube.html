<div class="video-container" id="video">
  <a class="video-placeholder" href="https://youtu.be/{{ include.video_id }}"
     data-video-id="{{ include.video_id }}" aria-label="Video: {{ page.title | escape }}">
    <img src="https://i.ytimg.com/vi/{{ include.video_id }}/hqdefault.jpg" alt="" loading="lazy">
    <span class="play-button"></span>
  </a>
</div>
<div class="print-content">
  Video link — <a href="https://youtu.be/{{ include.video_id }}">https://youtu.be/{{ include.video_id }}</a>
</div>
{%- if page.transcript %}
{%- capture transcript_md %}{% include_relative {{ page.transcript }} %}{% endcapture %}
{%- assign transcript_text = transcript_md | markdownify | strip_html | normalize_whitespace %}
{%- endif %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "VideoObject",
  "name": {{ page.title | jsonify }},
  "description": {{ page.description | strip | jsonify }},
  "uploadDate": {{ page.date | date_to_xmlschema | jsonify }},
  "thumbnailUrl": [
    {{ page.image | absolute_url | jsonify }},
    "https://i.ytimg.com/vi/{{ include.video_id }}/hqdefault.jpg"
  ],
  "embedUrl": "https://www.youtube.com/embed/{{ include.video_id }}",
  "url": {{ page.url | absolute_url | jsonify }},
  "inLanguage": {{ page.talk_language | default: "en" | jsonify }},
  "author": {
    "@type": "Person",
    "name": {{ site.author.name | jsonify }},
    "url": {{ '/about/' | absolute_url | jsonify }}
  }
  {%- if page.paper %},
  "about": {
    "@type": "ScholarlyArticle",
    "name": {{ page.paper.title | jsonify }},
    "url": {{ page.paper.url | jsonify }}
  }
  {%- endif %}
  {%- if transcript_text %},
  "transcript": {{ transcript_text | jsonify }}
  {%- endif %}
}
</script>
