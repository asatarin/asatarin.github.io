{%- assign slide = include.slide | default: 1 -%}
{%- assign slide_index = slide | minus: 1 -%}
{%- assign deck_url = "https://speakerdeck.com/player/" | append: include.data_id -%}
<div class="video-container">
  <a class="slides-placeholder" href="{{ include.print_alt_url | default: deck_url }}"
     data-deck-id="{{ include.data_id }}" data-slide="{{ slide }}" aria-label="Slides: {{ page.title | escape }}">
    <img src="https://files.speakerdeck.com/presentations/{{ include.data_id }}/slide_{{ slide_index }}.jpg"
         alt="" loading="lazy">
    <span class="play-button"></span>
  </a>
</div>
{% if include.print_alt_url %}
<div class="print-content">
    Slides — <a href="{{ include.print_alt_url }}">{{ include.print_alt_url }}</a>
</div>
{% endif %}
